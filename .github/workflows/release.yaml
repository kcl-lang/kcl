name: Build and Release kcl-lib and kcl-language-server

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # Required to create a release and upload assets

jobs:
  build:
    name: Build on ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
            lib_name: libkcl.so
            zig_target: x86_64-unknown-linux-gnu.2.17
          - target: linux-arm64
            os: ubuntu-22.04-arm
            lib_name: libkcl.so
            zig_target: aarch64-unknown-linux-gnu.2.17
          - target: darwin-amd64
            os: macos-15-intel
            lib_name: libkcl.dylib
            macos_deployment_target: '10.13'
          - target: darwin-arm64
            os: macos-latest
            lib_name: libkcl.dylib
            macos_deployment_target: '11.0'
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          submodules: "true"

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.91
          override: true

      - name: Install cargo-zigbuild (Linux, for GLIBC 2.17)
        if: startsWith(matrix.os, 'ubuntu-')
        shell: bash
        run: |
          pip3 install ziglang
          cargo install --locked cargo-zigbuild

      - name: Build kcl-lib (Linux, GLIBC 2.17)
        if: startsWith(matrix.os, 'ubuntu-')
        shell: bash
        run: |
          cargo clean
          cargo zigbuild --target ${{ matrix.zig_target }} -r -p kcl-lib
          mkdir -p release/lib
          cp -f target/${{ matrix.zig_target }}/release/${{ matrix.lib_name }} release/lib/

      - name: Build kcl-lib (macOS)
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          cargo build --release -p kcl-lib
          mkdir -p release/lib
          cp -f target/release/${{ matrix.lib_name }} release/lib/

      - name: Build kcl-language-server
        shell: bash
        run: |
          cargo build --release --manifest-path crates/tools/src/LSP/Cargo.toml
          mkdir -p release/language-server
          cp -f target/release/kcl-language-server release/language-server/

      - name: Package kcl-lib
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          cd release/lib
          tar -czvf "../../kcl-lib-${TAG}-${{ matrix.target }}.tar.gz" .
          cd ../..

      - name: Package kcl-language-server
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          cd release/language-server
          tar -czvf "../../kcl-language-server-${TAG}-${{ matrix.target }}.tar.gz" .
          cd ../..

      - name: List packaged artifacts
        shell: bash
        run: ls -la kcl-lib-*.tar.gz kcl-language-server-*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: kcl-lib-${{ matrix.target }}
          if-no-files-found: error
          path: kcl-lib-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: kcl-language-server-${{ matrix.target }}
          if-no-files-found: error
          path: kcl-language-server-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f -name '*.tar.gz' | sort

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
              artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}