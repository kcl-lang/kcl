name: Build and Release kcl-lib and kcl-language-server

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # Required to create a release and upload assets

jobs:
  build:
    name: Build on ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc (cdylib, GLIBC 2.17 for old-system compat)
          - target: linux-amd64
            os: ubuntu-latest
            lib_build: zigbuild
            lib_target: x86_64-unknown-linux-gnu.2.17
            lib_subpath: x86_64-unknown-linux-gnu
            lib_name: libkcl.so
            lsp_build: zigbuild
            lsp_target: x86_64-unknown-linux-gnu.2.17
            lsp_subpath: x86_64-unknown-linux-gnu
            lsp_bin: kcl-language-server
          - target: linux-arm64
            os: ubuntu-22.04-arm
            lib_build: zigbuild
            lib_target: aarch64-unknown-linux-gnu.2.17
            lib_subpath: aarch64-unknown-linux-gnu
            lib_name: libkcl.so
            lsp_build: zigbuild
            lsp_target: aarch64-unknown-linux-gnu.2.17
            lsp_subpath: aarch64-unknown-linux-gnu
            lsp_bin: kcl-language-server
          # Linux musl (staticlib)
          - target: linux-musl-amd64
            os: ubuntu-latest
            lib_build: zigbuild
            lib_target: x86_64-unknown-linux-musl
            lib_subpath: x86_64-unknown-linux-musl
            lib_name: libkcl.a
            lsp_build: none
          - target: linux-musl-arm64
            os: ubuntu-22.04-arm
            lib_build: zigbuild
            lib_target: aarch64-unknown-linux-musl
            lib_subpath: aarch64-unknown-linux-musl
            lib_name: libkcl.a
            lsp_build: none
          # macOS
          - target: darwin-amd64
            os: macos-15-intel
            lib_build: native
            lib_name: libkcl.dylib
            lsp_build: native
            lsp_bin: kcl-language-server
            macos_deployment_target: '10.13'
          - target: darwin-arm64
            os: macos-latest
            lib_build: native
            lib_name: libkcl.dylib
            lsp_build: native
            lsp_bin: kcl-language-server
            macos_deployment_target: '11.0'
          # Windows MSVC
          - target: windows-amd64
            os: windows-latest
            lib_build: native
            lib_name: kcl.dll
            lsp_build: native
            lsp_bin: kcl-language-server.exe
          # Windows MSVC on ARM64, cross-compiled from the x64 runner. There is
          # no ARM64 language server, so only the C API library is built. The
          # kcl-lang/lib vendoring flow needs this: its Go SDK embeds a
          # kcl.dll for windows/arm64 and zig/build.zig links the same path.
          - target: windows-arm64
            os: windows-latest
            lib_build: native
            lib_target: aarch64-pc-windows-msvc
            lib_subpath: aarch64-pc-windows-msvc
            lib_name: kcl.dll
            lsp_build: none
          # WebAssembly (WASI preview1)
          - target: wasm32-wasip1
            os: ubuntu-latest
            lib_build: wasm
            lib_subpath: wasm32-wasip1
            lib_name: kcl.wasm
            lsp_build: none
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          submodules: "true"

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.91
          override: true

      - name: Install cargo-zigbuild (Linux glibc / musl)
        if: matrix.lib_build == 'zigbuild' || matrix.lsp_build == 'zigbuild'
        shell: bash
        run: |
          pip3 install ziglang
          cargo install --locked cargo-zigbuild
          if [ -n "${{ matrix.lib_subpath }}" ]; then rustup target add ${{ matrix.lib_subpath }}; fi
          if [ -n "${{ matrix.lsp_subpath }}" ]; then rustup target add ${{ matrix.lsp_subpath }}; fi

      - name: Set up MSVC dev command prompt (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: "Build kcl-lib (zigbuild: Linux glibc / musl)"
        if: matrix.lib_build == 'zigbuild'
        shell: bash
        run: |
          cargo zigbuild --target ${{ matrix.lib_target }} -r -p kcl-lib
          mkdir -p release/lib
          cp -f target/${{ matrix.lib_subpath }}/release/${{ matrix.lib_name }} release/lib/

      - name: "Build kcl-lib (native: macOS)"
        if: matrix.lib_build == 'native' && matrix.os != 'windows-latest'
        shell: bash
        run: |
          cargo build --release -p kcl-lib
          mkdir -p release/lib
          cp -f target/release/${{ matrix.lib_name }} release/lib/

      - name: "Build kcl-lib (native: Windows MSVC)"
        if: matrix.lib_build == 'native' && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # matrix.lib_target is empty for the host-native windows-amd64 leg
          # and set for the cross-compiled windows-arm64 leg. Either way the
          # artifact lands in target/[lib_subpath/]release/<lib_name>.
          $target = "${{ matrix.lib_target }}"
          $subpath = "${{ matrix.lib_subpath }}"
          if ($target) {
            rustup target add $target
            cargo build --release -p kcl-lib --target $target
          } else {
            cargo build --release -p kcl-lib
          }
          New-Item -ItemType Directory -Force -Path release/lib | Out-Null
          $src = if ($subpath) { "target/$subpath/release/${{ matrix.lib_name }}" } else { "target/release/${{ matrix.lib_name }}" }
          Write-Host "staging $src"
          Copy-Item -Force $src release/lib/

      - name: Build kcl-lib (WASM)
        if: matrix.lib_build == 'wasm'
        shell: bash
        run: |
          rustup target add wasm32-wasip1
          RUSTFLAGS="-Cpanic=abort -Cllvm-args=-wasm-use-legacy-eh=false" \
            cargo build --target=wasm32-wasip1 --release -p kcl-lib
          mkdir -p release/lib
          cp -f target/wasm32-wasip1/release/${{ matrix.lib_name }} release/lib/

      - name: "Build kcl-language-server (zigbuild: Linux glibc)"
        if: matrix.lsp_build == 'zigbuild'
        shell: bash
        run: |
          cargo zigbuild --target ${{ matrix.lsp_target }} -r \
            --manifest-path crates/tools/src/LSP/Cargo.toml
          mkdir -p release/language-server
          cp -f target/${{ matrix.lsp_subpath }}/release/${{ matrix.lsp_bin }} release/language-server/

      - name: "Build kcl-language-server (native: macOS)"
        if: matrix.lsp_build == 'native' && matrix.os != 'windows-latest'
        shell: bash
        run: |
          cargo build --release --manifest-path crates/tools/src/LSP/Cargo.toml
          mkdir -p release/language-server
          cp -f target/release/${{ matrix.lsp_bin }} release/language-server/

      - name: Build kcl-language-server (Windows)
        if: matrix.lsp_build == 'native' && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo build --release --manifest-path crates/tools/src/LSP/Cargo.toml
          New-Item -ItemType Directory -Force -Path release/language-server | Out-Null
          Copy-Item -Force "target/release/${{ matrix.lsp_bin }}" release/language-server/

      - name: Package kcl-lib (Linux / macOS / WASM)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          cd release/lib
          tar -czvf "../../kcl-lib-${TAG}-${{ matrix.target }}.tar.gz" .
          cd ../..

      - name: Package kcl-lib (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path release/lib/* -DestinationPath "kcl-lib-${tag}-${{ matrix.target }}.zip" -Force

      - name: Package kcl-language-server (Linux / macOS)
        if: (matrix.lsp_build == 'native' || matrix.lsp_build == 'zigbuild') && matrix.os != 'windows-latest'
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          cd release/language-server
          tar -czvf "../../kcl-language-server-${TAG}-${{ matrix.target }}.tar.gz" .
          cd ../..

      - name: Package kcl-language-server (Windows)
        if: matrix.lsp_build == 'native' && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path release/language-server/* -DestinationPath "kcl-language-server-${tag}-${{ matrix.target }}.zip" -Force

      - name: List packaged artifacts (Linux / macOS / WASM)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: ls -la kcl-lib-*.tar.gz kcl-language-server-*.tar.gz 2>/dev/null || true

      - name: List packaged artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Get-ChildItem -Name kcl-lib-*.zip, kcl-language-server-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: kcl-lib-${{ matrix.target }}
          if-no-files-found: error
          path: kcl-lib-${{ github.ref_name }}-${{ matrix.target }}.*

      - uses: actions/upload-artifact@v4
        if: matrix.lsp_build != 'none'
        with:
          name: kcl-language-server-${{ matrix.target }}
          if-no-files-found: error
          path: kcl-language-server-${{ github.ref_name }}-${{ matrix.target }}.*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # update-taps rewrites the tap and bucket to point at the assets this job
      # publishes. Without the token that would leave every published kcl-lsp
      # install path pointing at a release nobody can update, so fail here first.
      - name: Check that the deploy token is available
        shell: bash
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "::error::DEPLOY_TOKEN is not available to this workflow"
            exit 1
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
              artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-taps:
    name: Update Homebrew tap and Scoop bucket
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      # GoReleaser only manages the kcl CLI in these repos, so kcl-lsp is bumped
      # here. The checksums come from the artifacts published by the release job.
      - name: Download kcl-language-server artifacts
        uses: actions/download-artifact@v4
        with:
          name: kcl-language-server-*
          path: artifacts

      - name: Render kcl-lsp formula and Scoop manifest
        shell: bash
        run: |
          python3 .github/scripts/update_lsp_taps.py \
            --tag "${{ github.ref_name }}" \
            --assets-dir artifacts \
            --out-dir tap-files

      - name: Check out homebrew-tap
        uses: actions/checkout@v3
        with:
          repository: kcl-lang/homebrew-tap
          ref: main
          path: homebrew-tap
          # GITHUB_TOKEN is scoped to this repo, so the org deploy token is used
          # to push to the tap and the bucket. Needs write access to both.
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Check out scoop-bucket
        uses: actions/checkout@v3
        with:
          repository: kcl-lang/scoop-bucket
          ref: main
          path: scoop-bucket
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Commit kcl-lsp formula and Scoop manifest
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp tap-files/HomebrewFormula/*.rb homebrew-tap/HomebrewFormula/
          cp tap-files/Scoops/kcl-lsp.json scoop-bucket/Scoops/

          # GoReleaser also pushes to these repos, so rebase before pushing in
          # case it landed a commit first.
          commit_and_push() {
            local dir="$1" message="$2"
            git -C "$dir" add -A
            if git -C "$dir" diff --cached --quiet; then
              echo "$dir already up to date, nothing to commit"
              return
            fi
            git -C "$dir" commit -m "$message"
            git -C "$dir" pull --rebase origin main
            git -C "$dir" push origin main
          }

          commit_and_push homebrew-tap "chore(kcl-lsp): update formula to ${TAG}"
          commit_and_push scoop-bucket "chore(kcl-lsp): update manifest to ${TAG}"
